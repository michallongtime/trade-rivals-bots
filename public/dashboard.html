<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TradeContest Bot</title>
<style>
  :root {
    --bg: #0f1117; --panel: #171a22; --border: #262b38; --text: #e6e9f0;
    --muted: #8b93a7; --accent: #4f8cff; --green: #34c77b; --red: #f0556e;
    --yellow: #e8b33c; --gray: #6b7385;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; } /* hidden musi wygrywać z display:flex overlayu */
  body { background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 18px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .badge { font-size: 12px; padding: 3px 9px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
  .badge.live { color: var(--green); border-color: var(--green); }
  .badge.warn { color: var(--yellow); border-color: var(--yellow); }
  .controls { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  input[type=number] { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; width: 90px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 13px; }
  button:hover { filter: brightness(1.12); }
  button.ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
  button.danger { background: transparent; border: 1px solid var(--red); color: var(--red); }
  button.mini { padding: 3px 8px; font-size: 12px; border-radius: 6px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .chip { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .chip b { color: var(--text); }
  .chip.running b { color: var(--green); }
  .chip.error b { color: var(--red); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: #1b1f2b; }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .st.running .dot { background: var(--green); } .st.running { color: var(--green); }
  .st.paused .dot { background: var(--gray); } .st.paused { color: var(--muted); }
  .st.waiting .dot { background: var(--yellow); } .st.waiting { color: var(--yellow); }
  .st.needs_funding .dot { background: var(--yellow); } .st.needs_funding { color: var(--yellow); }
  .st.error .dot { background: var(--red); } .st.error { color: var(--red); }
  .st.new .dot { background: var(--gray); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  .muted { color: var(--muted); }
  .actions { display: flex; gap: 4px; }
  .err { color: var(--red); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .dialog { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px; width: min(660px, 94vw); max-height: 82vh; display: flex; flex-direction: column; }
  .dialog h2 { font-size: 15px; margin-bottom: 6px; }
  .dialog .hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  #proposalRows { overflow-y: auto; margin-bottom: 4px; }
  .prow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .prow input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; min-width: 0; }
  .prow .pemail { flex: 1.4; }
  .prow input.invalid { border-color: var(--red); }
  .modal-actions { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; align-items: center; flex-wrap: wrap; }
  #modalError { margin-top: 8px; max-width: 100%; white-space: normal; }
  #logpanel { position: fixed; left: 20px; right: 20px; bottom: 16px; background: #0b0d12; border: 1px solid var(--border); border-radius: 10px; max-height: 42vh; display: none; flex-direction: column; }
  #logpanel.open { display: flex; }
  #loghead { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  #logbody { overflow-y: auto; padding: 10px 12px; font: 12px/1.6 ui-monospace, Consolas, monospace; }
  .l { color: var(--muted); } .l.info { color: var(--text); } .l.warn { color: var(--yellow); } .l.error { color: var(--red); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>🤖 TradeContest Bot</h1>
  <span class="badge" id="bMode">–</span>
  <span class="badge">AI: <span id="bAi">–</span></span>
  <span class="badge">API: <span id="bApi">–</span></span>
  <span class="badge">uptime <span id="bUp">–</span></span>
</header>

<div class="controls">
  <input type="number" id="count" value="1" min="1" max="500">
  <button id="createBtn">Stwórz boty</button>
  <button class="ghost" id="refreshBtn">Odśwież</button>
  <span class="muted" id="queueInfo"></span>
</div>

<div class="chips" id="chips"></div>

<div id="modal" class="overlay" hidden>
  <div class="dialog">
    <h2>Nowe boty <span id="modalCount"></span></h2>
    <div class="hint">Edytuj nicki i emaile, losuj pojedyncze (🔄) lub wszystkie (🎲). Zatwierdź, aby zarejestrować.</div>
    <div id="proposalRows"></div>
    <div class="modal-actions">
      <button class="ghost" id="regenBtn">🎲 Losuj ponownie</button>
      <button class="ghost" id="cancelBtn">Anuluj</button>
      <button id="confirmBtn">Zatwierdź i utwórz</button>
    </div>
    <div id="modalError" class="err"></div>
  </div>
</div>

<table>
  <thead>
    <tr>
      <th>Bot</th><th>Status</th><th>Equity</th><th>Realiz. PnL</th><th>Niezrealiz.</th>
      <th>Rank</th><th>Pozycje</th><th>Ostatnia decyzja</th><th>Ostatni błąd</th><th>Akcje</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>

<div id="logpanel">
  <div id="loghead">
    <span id="logTitle">Log</span>
    <button class="ghost mini" id="logClose">✕</button>
  </div>
  <div id="logbody"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let bots = [];
let status = null;
let selectedBot = null;
let logTimer = null;

function fmt(x) {
  if (x == null) return '–';
  const n = Number(x);
  if (!Number.isFinite(n)) return '–';
  return n.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pnlCls(x) { const n = Number(x); return n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || (j.errors ? j.errors.join('; ') : 'HTTP ' + r.status));
  return j;
}

async function load() {
  try {
    status = await api('/api/status');
    bots = (await api('/api/bots')).bots;
  } catch (e) {
    console.error(e);
    return;
  }
  $('bMode').textContent = status.mode.toUpperCase();
  $('bMode').className = 'badge ' + (status.mode === 'live' ? 'live' : 'warn');
  $('bAi').textContent = `${status.aiProvider}${status.aiModel ? ' / ' + status.aiModel : ''}`;
  $('bApi').textContent = status.baseUrl;
  const u = status.uptimeSec;
  $('bUp').textContent = `${Math.floor(u / 3600)}h ${Math.floor((u % 3600) / 60)}m ${u % 60}s`;
  $('queueInfo').textContent = status.registrationQueueLen ? `⏳ w kolejce: ${status.registrationQueueLen}` : '';

  const t = status.totals;
  const chip = (label, key, cls) => `<div class="chip ${cls}">${label}: <b>${t[key] ?? 0}</b></div>`;
  $('chips').innerHTML =
    chip('Razem', 'total') + chip('Aktywne', 'running', 'running') +
    chip('Wstrzymane', 'paused') + chip('Czekają', 'waiting') +
    chip('Brak środków', 'needs_funding') + chip('Błędy', 'error', 'error');

  $('rows').innerHTML = bots.length ? bots.map(rowHtml).join('') : '<tr><td colspan="10" class="empty">Brak botów — utwórz pierwsze konta powyżej.</td></tr>';
}

function rowHtml(b) {
  const dec = b.last_decision
    ? (b.last_decision.error ? `${b.last_decision.action} (${b.last_decision.error})` : JSON.stringify(b.last_decision))
    : '–';
  const eq = b.portfolio ? b.portfolio.equity : null;
  const rp = b.portfolio ? b.portfolio.realized_pnl : null;
  const up = b.portfolio ? b.portfolio.unrealized_pnl : null;
  const pnls = b.positions.length ? `<span class="muted">${b.positions.length}×</span> ` + b.positions.map((p) =>
    `<span title="${esc(p.market_symbol)} ${p.side} qty ${p.qty} @ ${p.entry_price}">${esc(p.market_symbol)}</span>`).join(', ') : '–';
  const actions = b.status === 'running' || b.status === 'waiting' || b.status === 'needs_funding' || b.status === 'error' || b.status === 'new'
    ? `<button class="mini ghost" onclick="evPause('${b.id}', event)">⏸</button>`
    : `<button class="mini ghost" onclick="evResume('${b.id}', event)">▶</button>`;
  const plan = b.trading_plan;
  return `<tr class="clickable" onclick="openLog('${b.id}', '${esc(b.nickname)}')">
    <td><b>${esc(b.nickname)}</b><div class="muted" style="font-size:11px">${esc(b.email ?? '')}${plan ? ` · 🎯 ${esc(plan.symbols.join(', '))} · do ${plan.maxPositionAmountUsd} USDT` : ''}</div></td>
    <td><span class="st ${b.status}"><span class="dot"></span>${b.status.replace('_', ' ')}</span></td>
    <td class="${pnlCls(Number(eq) - 10000)}">${fmt(eq)}</td>
    <td class="${pnlCls(rp)}">${fmt(rp)}</td>
    <td class="${pnlCls(up)}">${fmt(up)}</td>
    <td>${b.rank != null ? `${b.rank}/${b.players_count ?? '?'}` : '–'}</td>
    <td>${pnls}</td>
    <td class="muted" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(dec)}">${esc(dec)}</td>
    <td><span class="err" title="${esc(b.last_error ?? '')}">${esc(b.last_error ?? '')}</span></td>
    <td><div class="actions" onclick="event.stopPropagation()">${actions}<button class="mini danger" onclick="evDelete('${b.id}', event)">🗑</button></div></td>
  </tr>`;
}

async function evPause(id, e) { e?.stopPropagation(); await api(`/api/bots/${id}/pause`, { method: 'POST' }); load(); }
async function evResume(id, e) { e?.stopPropagation(); await api(`/api/bots/${id}/resume`, { method: 'POST' }); load(); }
async function evDelete(id, e) {
  e?.stopPropagation();
  if (!confirm('Usunąć bota? Token zostanie wylogowany.')) return;
  await api(`/api/bots/${id}/delete`, { method: 'POST' });
  if (selectedBot === id) closeLog();
  load();
}

function openLog(id, nickname) {
  selectedBot = id;
  $('logTitle').textContent = `Log: ${nickname}`;
  $('logpanel').classList.add('open');
  refreshLog();
  clearInterval(logTimer);
  logTimer = setInterval(refreshLog, 2000);
}
function closeLog() {
  $('logpanel').classList.remove('open');
  clearInterval(logTimer);
  selectedBot = null;
}
async function refreshLog() {
  if (!selectedBot) return;
  try {
    const j = await api(`/api/bots/${selectedBot}/log`);
    $('logbody').innerHTML = j.log.map((l) =>
      `<div class="l ${l.level}">${esc(l.ts.slice(11, 19))} <b>${esc(l.level)}</b> ${esc(l.msg)}</div>`).join('') || '<div class="empty">brak wpisów</div>';
    $('logbody').scrollTop = $('logbody').scrollHeight;
  } catch { /* bot usunięty */ }
}

// --- modal propozycji nicków ---
let proposals = [];
let emailTouched = [];

function closeModal() {
  $('modal').hidden = true;
  $('modalError').textContent = '';
}

function renderProposals() {
  $('modalCount').textContent = `(${proposals.length})`;
  $('proposalRows').innerHTML = proposals.map((p, i) =>
    `<div class="prow">
      <input class="pnick" value="${esc(p.nickname)}" spellcheck="false" placeholder="nickname (3-24: a-zA-Z0-9_)">
      <input class="pemail" value="${esc(p.email)}" spellcheck="false" placeholder="email">
      <button class="mini ghost">🔄</button>
    </div>`).join('');
  $('proposalRows').querySelectorAll('.prow').forEach((row, i) => {
    const nickInp = row.querySelector('.pnick');
    const emailInp = row.querySelector('.pemail');
    nickInp.oninput = () => {
      proposals[i].nickname = nickInp.value;
      if (!emailTouched[i]) {
        const newLocal = nickInp.value.toLowerCase().replace(/^_+|_+$/g, '');
        if (newLocal) {
          proposals[i].email = newLocal + '@' + proposals[i].email.split('@')[1];
          emailInp.value = proposals[i].email;
        }
      }
      nickInp.classList.remove('invalid');
    };
    emailInp.oninput = () => {
      emailTouched[i] = true;
      proposals[i].email = emailInp.value;
      emailInp.classList.remove('invalid');
    };
    row.querySelector('button').onclick = () => regenOne(i);
  });
}

async function propose(count, exclude) {
  return (await api('/api/bots/propose', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ count, exclude }),
  })).accounts;
}

async function openPropose() {
  const count = Math.max(1, Math.min(Number($('count').value) || 1, 500));
  proposals = await propose(count, []);
  emailTouched = proposals.map(() => false);
  renderProposals();
  $('modal').hidden = false;
}

async function regenOne(i) {
  const p = (await propose(1, proposals))[0];
  proposals[i] = p;
  emailTouched[i] = false;
  renderProposals();
}

async function regenAll() {
  proposals = await propose(proposals.length, proposals);
  emailTouched = proposals.map(() => false);
  renderProposals();
}

async function confirmProposals() {
  const NICK = /^[a-zA-Z0-9_]{3,24}$/;
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const rows = [...$('proposalRows').querySelectorAll('.prow')];
  const seen = new Set();
  let bad = false;
  proposals.forEach((p, i) => {
    const nickOk = NICK.test(p.nickname) && !seen.has(p.nickname.toLowerCase());
    const emailOk = EMAIL.test(p.email);
    seen.add(p.nickname.toLowerCase());
    rows[i].querySelector('.pnick').classList.toggle('invalid', !nickOk);
    rows[i].querySelector('.pemail').classList.toggle('invalid', !emailOk);
    if (!nickOk || !emailOk) bad = true;
  });
  if (bad) {
    $('modalError').textContent = 'Popraw zaznaczone pola: nick 3-24 znaki [a-zA-Z0-9_], unikalny; email poprawny.';
    return;
  }
  $('modalError').textContent = '';
  try {
    const r = await api('/api/bots', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ accounts: proposals }),
    });
    closeModal();
    load();
  } catch (e) {
    $('modalError').textContent = e.message;
  }
}

$('createBtn').onclick = openPropose;
$('regenBtn').onclick = regenAll;
$('cancelBtn').onclick = closeModal;
$('confirmBtn').onclick = confirmProposals;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });
$('refreshBtn').onclick = load;
$('logClose').onclick = closeLog;
setInterval(load, 3000);
load();
</script>
</body>
</html>
