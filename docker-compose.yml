services:
  bot:
    build: .
    image: tradecontest-bot:latest
    container_name: tradecontest-bot
    restart: unless-stopped
    ports:
      - "4001:4001"
    volumes:
      # config.json jest gitignored (sekrety) — żyje na hoście; data/ to
      # accounts.json + state.json (per-target), musi przetrwać rebuildy.
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
    stop_grace_period: 20s
    # Observacyjnie (docker compose ps pokazuje healthy) — restart robi watchdog.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
